name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for changelog

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binary
        shell: bash
        run: |
          COMMIT=${GITHUB_SHA::8}
          go build -ldflags "-X filex/internal/buildinfo.Version=${{ steps.version.outputs.version }} -X filex/internal/buildinfo.Commit=$COMMIT -X filex/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o filex.exe ./cmd/filex
          
          # Rename with version number
          cp filex.exe filex-${{ steps.version.outputs.tag }}.exe
          ls -lh filex*.exe

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum filex-${{ steps.version.outputs.tag }}.exe > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            echo "Generating changelog from $PREV_TAG to HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Escape for GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FileX ${{ steps.version.outputs.tag }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ### PowerShell (recommended)
            ```powershell
            irm https://raw.githubusercontent.com/BaixuanZhu/FileX/main/install.ps1 | iex
            ```
            
            ### Go install
            ```bash
            go install github.com/lowlighter/filex/cmd/filex@latest
            ```
            
            ### Manual download
            Download `filex-${{ steps.version.outputs.tag }}.exe` below and add to your PATH.
            
            ## Checksums
            ```
            ${{ steps.checksum.outputs.content }}
            ```
          files: |
            filex-${{ steps.version.outputs.tag }}.exe
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test installation script
        shell: pwsh
        run: |
          Write-Host "=== Testing install.ps1 ===" -ForegroundColor Cyan
          
          # Wait for release to propagate
          Write-Host "Waiting for release to propagate..."
          Start-Sleep -Seconds 15
          
          # Set up test install directory
          $testInstallDir = Join-Path $env:RUNNER_TEMP "FileX-Test-Install"
          $env:LOCALAPPDATA = $testInstallDir
          
          Write-Host "Test install directory: $testInstallDir"
          
          # Run install script
          try {
            .\install.ps1
            Write-Host "✓ Install script completed" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Install script failed: $_"
            exit 1
          }
          
          # Verify installation
          $installedExe = Join-Path $testInstallDir "FileX\filex.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "✗ Installed binary not found at $installedExe"
            exit 1
          }
          Write-Host "✓ Binary installed to $installedExe" -ForegroundColor Green
          
          # Test binary execution
          try {
            $versionOutput = & $installedExe version 2>&1 | ConvertFrom-Json
            if (-not $versionOutput.ok) {
              Write-Error "✗ Binary execution failed"
              exit 1
            }
            Write-Host "✓ Binary version: $($versionOutput.data.version)" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Failed to execute binary: $_"
            exit 1
          }
          
          # Verify PATH was updated
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$testInstallDir\FileX*") {
            Write-Warning "⚠ Install directory not in PATH (may be expected in CI)"
          }
          else {
            Write-Host "✓ Install directory added to PATH" -ForegroundColor Green
          }
          
          Write-Host "`n=== Installation test passed ===" -ForegroundColor Green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filex-${{ steps.version.outputs.tag }}
          path: |
            filex-${{ steps.version.outputs.tag }}.exe
            checksums.txt
          retention-days: 30
