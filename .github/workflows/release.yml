name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goarch: amd64
            archive_ext: zip
            binary_name: filex.exe
            platform: windows
          - os: ubuntu-latest
            goarch: amd64
            archive_ext: tar.gz
            binary_name: filex
            platform: linux
          - os: macos-latest
            goarch: amd64
            archive_ext: tar.gz
            binary_name: filex
            platform: darwin
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binary
        shell: bash
        run: |
          COMMIT=${GITHUB_SHA::8}
          go build -ldflags "-X filex/internal/buildinfo.Version=${{ steps.version.outputs.version }} -X filex/internal/buildinfo.Commit=$COMMIT -X filex/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ${{ matrix.binary_name }} ./cmd/filex

      - name: Prepare archive directory
        shell: bash
        run: |
          ARCHIVE_DIR="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64"
          mkdir -p "$ARCHIVE_DIR/docs"
          cp ${{ matrix.binary_name }} "$ARCHIVE_DIR/"
          cp README.md "$ARCHIVE_DIR/"
          if [ -f "LICENSE" ]; then
            cp LICENSE "$ARCHIVE_DIR/"
          fi
          if [ -d "docs" ]; then
            cp -r docs/* "$ARCHIVE_DIR/docs/"
          fi
          ls -lh "$ARCHIVE_DIR/"

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archiveDir = "filex-${{ steps.version.outputs.tag }}-windows-x64"
          $archiveName = "filex-${{ steps.version.outputs.tag }}-windows-x64.zip"
          Compress-Archive -Path $archiveDir -DestinationPath $archiveName
          ls $archiveName

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_DIR="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64"
          ARCHIVE_NAME="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$ARCHIVE_DIR"
          ls -lh "$ARCHIVE_NAME"

      - name: Generate checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "filex-${{ steps.version.outputs.tag }}-windows-x64.zip"
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ASCII
          Get-Content "$archive.sha256"

      - name: Generate checksum (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.tar.gz"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: filex-${{ matrix.platform }}-x64
          path: |
            filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}
            filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}.sha256
          retention-days: 7

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          find artifacts -type f -ls

      - name: Create combined checksums file
        run: |
          cat artifacts/*/*.sha256 > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            echo "Generating changelog from $PREV_TAG to HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FileX ${{ steps.version.outputs.tag }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ### PowerShell (Windows)
            ```powershell
            irm https://raw.githubusercontent.com/BaixuanZhu/FileX/main/install.ps1 | iex
            ```
            
            ### Shell (Linux/macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/BaixuanZhu/FileX/main/install.sh | bash
            ```
            
            ### Manual download
            Download the archive for your platform below and extract to your PATH.
            
            ## Checksums
            ```
            $(cat checksums.txt)
            ```
          files: |
            artifacts/*/*.zip
            artifacts/*/*.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-windows:
    name: Test Windows Installation
    needs: create-release
    runs-on: windows-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test install.ps1
        shell: pwsh
        run: |
          Write-Host "=== Testing install.ps1 ===" -ForegroundColor Cyan
          
          # Wait for release to propagate
          Write-Host "Waiting for release to propagate..."
          Start-Sleep -Seconds 15
          
          # Set up test install directory
          $testInstallDir = Join-Path $env:RUNNER_TEMP "FileX-Test-Install"
          $env:LOCALAPPDATA = $testInstallDir
          
          Write-Host "Test install directory: $testInstallDir"
          
          # Run install script
          try {
            .\install.ps1
            Write-Host "✓ Install script completed" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Install script failed: $_"
            exit 1
          }
          
          # Verify installation structure
          $installedExe = Join-Path $testInstallDir "FileX\current\filex.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "✗ Installed binary not found at $installedExe"
            exit 1
          }
          Write-Host "✓ Binary installed to $installedExe" -ForegroundColor Green
          
          # Test binary execution
          try {
            $versionOutput = & $installedExe version 2>&1 | ConvertFrom-Json
            if (-not $versionOutput.ok) {
              Write-Error "✗ Binary execution failed"
              exit 1
            }
            Write-Host "✓ Binary version: $($versionOutput.data.version)" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Failed to execute binary: $_"
            exit 1
          }
          
          Write-Host "`n=== Installation test passed ===" -ForegroundColor Green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
