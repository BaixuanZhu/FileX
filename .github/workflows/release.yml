name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goarch: amd64
            archive_ext: zip
            binary_name: filex.exe
            platform: windows
          - os: ubuntu-latest
            goarch: amd64
            archive_ext: tar.gz
            binary_name: filex
            platform: linux
          - os: macos-latest
            goarch: amd64
            archive_ext: tar.gz
            binary_name: filex
            platform: darwin
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binary
        shell: bash
        run: |
          COMMIT=${GITHUB_SHA::8}
          go build -ldflags "-X filex/internal/buildinfo.Version=${{ steps.version.outputs.version }} -X filex/internal/buildinfo.Commit=$COMMIT -X filex/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ${{ matrix.binary_name }} ./cmd/filex

      - name: Prepare archive directory
        shell: bash
        run: |
          ARCHIVE_DIR="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64"
          mkdir -p "$ARCHIVE_DIR/docs"
          cp ${{ matrix.binary_name }} "$ARCHIVE_DIR/"
          cp README.md "$ARCHIVE_DIR/"
          if [ -f "LICENSE" ]; then
            cp LICENSE "$ARCHIVE_DIR/"
          fi
          if [ -d "docs" ]; then
            cp -r docs/* "$ARCHIVE_DIR/docs/"
          fi
          ls -lh "$ARCHIVE_DIR/"

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archiveDir = "filex-${{ steps.version.outputs.tag }}-windows-x64"
          $archiveName = "filex-${{ steps.version.outputs.tag }}-windows-x64.zip"
          Compress-Archive -Path $archiveDir -DestinationPath $archiveName
          ls $archiveName

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_DIR="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64"
          ARCHIVE_NAME="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$ARCHIVE_DIR"
          ls -lh "$ARCHIVE_NAME"

      - name: Generate checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "filex-${{ steps.version.outputs.tag }}-windows-x64.zip"
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ASCII
          Get-Content "$archive.sha256"

      - name: Generate checksum (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE="filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.tar.gz"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: filex-${{ matrix.platform }}-x64
          path: |
            filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}
            filex-${{ steps.version.outputs.tag }}-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}.sha256
          retention-days: 7

  build-installer:
    name: Build Windows Installer
    needs: build
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: filex-windows-x64
          path: archive

      - name: Extract archive
        shell: pwsh
        run: |
          # The artifact contains the zip file itself, so expand it first
          $zip = Get-ChildItem -Path archive -Filter "filex-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "Windows archive zip not found in artifact"
            exit 1
          }
          Write-Host "Archive: $($zip.FullName)"
          
          Expand-Archive -Path $zip.FullName -DestinationPath "archive-extracted"
          
          # Create bundled directory for NSIS
          New-Item -ItemType Directory -Path "installer\bundled" -Force | Out-Null
          
          # Copy contents (excluding the outer directory wrapper)
          Copy-Item -Path "archive-extracted\$($zip.BaseName)\*" -Destination "installer\bundled\" -Recurse -Force
          
          Write-Host "Bundled contents:"
          Get-ChildItem -Path "installer\bundled" -Recurse | Select-Object FullName

      - name: Install NSIS
        shell: pwsh
        run: |
          Write-Host "Installing NSIS..."
          choco install nsis -y --no-progress
          
          # Verify installation
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            Write-Host "✓ NSIS installed to $nsisPath" -ForegroundColor Green
            Get-ChildItem $nsisPath | Select-Object Name
          } else {
            Write-Error "NSIS installation failed"
            exit 1
          }

      - name: Build installer
        shell: pwsh
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          $version = "${{ steps.version.outputs.version }}"
          
          Write-Host "Building installer for version $version..."
          
          # Run from installer/ because NSIS resolves script paths against the
          # script's own directory; quote the define so $version expands instead
          # of being passed through as a literal parameter name
          Push-Location installer
          try {
            & $nsisPath "-DVERSION=$version" filex.nsi
            if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS build failed with exit code $LASTEXITCODE"
              exit 1
            }
          }
          finally {
            Pop-Location
          }
          
          if (Test-Path "installer\filex-setup.exe") {
            $size = (Get-Item "installer\filex-setup.exe").Length / 1MB
            Write-Host "✓ Installer built: installer\filex-setup.exe ($([math]::Round($size, 2)) MB)" -ForegroundColor Green
          } else {
            Write-Error "Installer file not found"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: filex-installer-windows
          path: installer\filex-setup.exe
          retention-days: 7

  test-installer:
    name: Test Windows Installer
    needs: build-installer
    runs-on: windows-latest

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: filex-installer-windows

      - name: Silent install
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "filex-setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found"
            exit 1
          }
          
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($process.ExitCode)"
            exit 1
          }
          Write-Host "Installer completed successfully"

      - name: Verify installation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "FileX"
          $failures = @()
          
          # Directory structure
          foreach ($path in @(
            "$installDir\filex.bat",
            "$installDir\uninstaller.exe",
            "$installDir\current\filex.exe",
            "$installDir\versions"
          )) {
            if (Test-Path $path) {
              Write-Host "OK: $path"
            } else {
              Write-Host "MISSING: $path"
              $failures += $path
            }
          }
          
          # Registry keys
          $regVersion = (Get-ItemProperty -Path "HKCU:\Software\FileX" -ErrorAction SilentlyContinue).Version
          if ($regVersion) {
            Write-Host "OK: registry version = $regVersion"
          } else {
            Write-Host "MISSING: HKCU\Software\FileX version"
            $failures += "registry version"
          }
          
          # PATH must contain the install directory
          $userPath = [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($userPath -like "*$installDir*") {
            Write-Host "OK: PATH contains $installDir"
          } else {
            Write-Host "MISSING: PATH entry for $installDir (user PATH: $userPath)"
            $failures += "PATH"
          }
          
          # Wrapper must run the binary
          try {
            $versionOutput = & "$installDir\filex.bat" version 2>&1 | ConvertFrom-Json
            if ($versionOutput.ok) {
              Write-Host "OK: filex.bat version = $($versionOutput.data.version)"
            } else {
              Write-Host "FAILED: filex.bat returned ok=false"
              $failures += "wrapper execution"
            }
          }
          catch {
            Write-Host "FAILED: cannot execute filex.bat: $_"
            $failures += "wrapper execution"
          }
          
          if ($failures.Count -gt 0) {
            Write-Error "Installation verification failed: $($failures -join ', ')"
            exit 1
          }

      - name: Silent uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "FileX"
          $uninstaller = Join-Path $installDir "uninstaller.exe"
          
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "Uninstaller exited with code $($process.ExitCode)"
            exit 1
          }
          Write-Host "Uninstaller completed successfully"

      - name: Verify uninstallation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "FileX"
          $failures = @()
          
          if (Test-Path $installDir) {
            Write-Host "LEFTOVER: $installDir still exists"
            $failures += "install directory"
          } else {
            Write-Host "OK: install directory removed"
          }
          
          $userPath = [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($userPath -like "*$installDir*") {
            Write-Host "LEFTOVER: PATH still contains $installDir"
            $failures += "PATH"
          } else {
            Write-Host "OK: PATH entry removed"
          }
          
          if (Get-ItemProperty -Path "HKCU:\Software\FileX" -ErrorAction SilentlyContinue) {
            Write-Host "LEFTOVER: HKCU\Software\FileX"
            $failures += "registry key"
          } else {
            Write-Host "OK: registry key removed"
          }
          
          if (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FileX" -ErrorAction SilentlyContinue) {
            Write-Host "LEFTOVER: uninstall registry key"
            $failures += "uninstall registry key"
          } else {
            Write-Host "OK: uninstall registry key removed"
          }
          
          if ($failures.Count -gt 0) {
            Write-Error "Uninstallation verification failed: $($failures -join ', ')"
            exit 1
          }

  create-release:
    name: Create Release
    needs: [build, test-installer]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          find artifacts -type f -ls

      - name: Create combined checksums file
        id: checksums
        run: |
          cat artifacts/*/*.sha256 > checksums.txt
          CHECKSUMS=$(cat checksums.txt)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHECKSUMS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, using all commits"
            # Generate a simple changelog from commit messages
            CHANGELOG=$(git log --pretty=format:"- %s" --reverse | grep -v "^- Merge" | head -20)
          else
            echo "Generating changelog from $PREV_TAG to HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --reverse | grep -v "^- Merge" | head -20)
          fi
          
          # Escape for GitHub Actions
          # Multi-line outputs need the delimiter syntax; %0A in a plain
          # key=value line is passed through as literal text
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FileX ${{ steps.version.outputs.tag }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ### Windows Installer (Recommended)
            Download `filex-setup.exe` and run it. The installer will:
            - Install FileX to `%LOCALAPPDATA%\FileX`
            - Add FileX to your PATH
            - Create Start Menu shortcuts
            
            ### PowerShell (Alternative)
            ```powershell
            irm https://raw.githubusercontent.com/BaixuanZhu/FileX/main/install.ps1 | iex
            ```
            
            ### Shell (Linux/macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/BaixuanZhu/FileX/main/install.sh | bash
            ```
            
            ### Manual download
            Download the archive for your platform below and extract to your PATH.
            
            ## Checksums
            
            ```
            ${{ steps.checksums.outputs.content }}
            ```
          files: |
            artifacts/*/*.zip
            artifacts/*/*.tar.gz
            artifacts/filex-installer-windows/filex-setup.exe
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-windows:
    name: Test Windows Installation
    needs: create-release
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test install.ps1
        shell: pwsh
        run: |
          Write-Host "=== Testing install.ps1 ===" -ForegroundColor Cyan
          
          # Wait for release to propagate
          Write-Host "Waiting for release to propagate..."
          Start-Sleep -Seconds 15
          
          # Set up test install directory
          $testInstallDir = Join-Path $env:RUNNER_TEMP "FileX-Test-Install"
          $env:LOCALAPPDATA = $testInstallDir
          
          Write-Host "Test install directory: $testInstallDir"
          
          # Run install script
          try {
            .\install.ps1
            Write-Host "✓ Install script completed" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Install script failed: $_"
            exit 1
          }
          
          # Verify installation structure
          $installedExe = Join-Path $testInstallDir "FileX\current\filex.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "✗ Installed binary not found at $installedExe"
            exit 1
          }
          Write-Host "✓ Binary installed to $installedExe" -ForegroundColor Green
          
          # Test binary execution
          try {
            $versionOutput = & $installedExe version 2>&1 | ConvertFrom-Json
            if (-not $versionOutput.ok) {
              Write-Error "✗ Binary execution failed"
              exit 1
            }
            Write-Host "✓ Binary version: $($versionOutput.data.version)" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Failed to execute binary: $_"
            exit 1
          }
          
          Write-Host "`n=== Installation test passed ===" -ForegroundColor Green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test installer
        shell: pwsh
        run: |
          Write-Host "`n=== Testing filex-setup.exe ===" -ForegroundColor Cyan
          
          # Download installer from release
          $tag = "${{ github.ref_name }}"
          $installerUrl = "https://github.com/BaixuanZhu/FileX/releases/download/$tag/filex-setup.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP "filex-setup.exe"
          
          Write-Host "Downloading installer from $installerUrl..."
          try {
            Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
            Write-Host "✓ Installer downloaded" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Failed to download installer: $_"
            exit 1
          }
          
          # Set up test install directory
          $testInstallDir = Join-Path $env:RUNNER_TEMP "FileX-Installer-Test"
          $env:LOCALAPPDATA = $testInstallDir
          
          Write-Host "Test install directory: $testInstallDir"
          
          # Run installer silently
          try {
            $process = Start-Process -FilePath $installerPath -ArgumentList "/S", "/D=$testInstallDir\FileX" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Write-Error "✗ Installer exited with code $($process.ExitCode)"
              exit 1
            }
            Write-Host "✓ Installer completed successfully" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Installer failed: $_"
            exit 1
          }
          
          # Verify installation
          $installedBat = Join-Path $testInstallDir "FileX\filex.bat"
          if (-not (Test-Path $installedBat)) {
            Write-Error "✗ Installed wrapper not found at $installedBat"
            exit 1
          }
          Write-Host "✓ Wrapper installed to $installedBat" -ForegroundColor Green
          
          $installedExe = Join-Path $testInstallDir "FileX\current\filex.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "✗ Installed binary not found at $installedExe"
            exit 1
          }
          Write-Host "✓ Binary linked at $installedExe" -ForegroundColor Green
          
          # Test execution via wrapper
          try {
            $versionOutput = & $installedBat version 2>&1 | ConvertFrom-Json
            if (-not $versionOutput.ok) {
              Write-Error "✗ Binary execution via wrapper failed"
              exit 1
            }
            Write-Host "✓ Binary version via wrapper: $($versionOutput.data.version)" -ForegroundColor Green
          }
          catch {
            Write-Error "✗ Failed to execute binary via wrapper: $_"
            exit 1
          }
          
          # Verify PATH was updated
          $userPath = [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($userPath -like "*$testInstallDir\FileX*") {
            Write-Host "✓ PATH updated correctly" -ForegroundColor Green
          }
          else {
            Write-Warning "PATH may not have been updated (expected in test environment)"
          }
          
          # Test uninstaller
          $uninstaller = Join-Path $testInstallDir "FileX\uninstaller.exe"
          if (Test-Path $uninstaller) {
            Write-Host "✓ Uninstaller created" -ForegroundColor Green
            
            # Run uninstaller silently
            try {
              $process = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
              if ($process.ExitCode -eq 0) {
                Write-Host "✓ Uninstaller completed successfully" -ForegroundColor Green
                
                # Verify removal
                if (-not (Test-Path $installedBat)) {
                  Write-Host "✓ Files removed" -ForegroundColor Green
                }
                else {
                  Write-Warning "Some files may remain after uninstall"
                }
              }
              else {
                Write-Warning "Uninstaller exited with code $($process.ExitCode)"
              }
            }
            catch {
              Write-Warning "Uninstaller test failed: $_"
            }
          }
          else {
            Write-Error "✗ Uninstaller not found"
            exit 1
          }
          
          Write-Host "`n=== Installer test passed ===" -ForegroundColor Green
