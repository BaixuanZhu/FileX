name: Env Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'internal/winenv/**'
      - 'internal/version/**'
      - 'cmd/filex/**'
      - '.github/workflows/test-env.yml'
  pull_request:
    paths:
      - 'internal/winenv/**'
      - 'internal/version/**'
      - 'cmd/filex/**'
      - '.github/workflows/test-env.yml'
  workflow_dispatch:

jobs:
  env-integration:
    name: Env Integration Tests (Windows VM)
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Snapshot environment before tests
        shell: pwsh
        run: |
          Write-Host "=== User Environment Variables (BEFORE) ==="
          reg query "HKCU\Environment" 2>$null | Out-String | Write-Host
          Write-Host "=== System Environment Variables (BEFORE) ==="
          reg query "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" 2>$null | Out-String | Write-Host

      - name: Run env integration tests
        env:
          TEST_ENV_CI: '1'
        run: go test -tags=integration ./internal/winenv/... ./internal/version/... ./cmd/filex/... -v -timeout=5m

      - name: Snapshot environment after tests
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== User Environment Variables (AFTER) ==="
          reg query "HKCU\Environment" 2>$null | Out-String | Write-Host
          Write-Host "=== System Environment Variables (AFTER) ==="
          reg query "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" 2>$null | Out-String | Write-Host

      - name: Verify test cleanup
        if: always()
        shell: pwsh
        run: |
          # Compare before/after snapshots
          # Tests should clean up any env vars they created
          # This step logs the state for manual verification if needed
          Write-Host "Environment state captured. Review before/after snapshots above."
